<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Route - University Transport System</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<style>
    body{
        background-color: brown;
    }
</style>
<body class="bg-gray-100">

<div class="flex">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-blue-900 text-white min-h-screen p-6">
        <h1 class="text-2xl font-bold mb-8">University Transport</h1>
        <nav class="space-y-4">
            <a href="index.html" class="block py-2 px-3 hover:bg-blue-700 rounded">Home</a>
            <a href="routes.html" class="block py-2 px-3 hover:bg-blue-700 rounded">View Routes</a>
            <a href="booking.html" class="block py-2 px-3 bg-blue-700 rounded">Book a Route</a>
            <a href="demo.html" class="block py-2 px-3 hover:bg-blue-700 rounded">System Demo</a>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 p-8">

        <h2 class="text-3xl font-bold mb-6">Book a Route</h2>

        <div class="bg-white p-6 rounded shadow max-w-xl">

            <label class="block mb-2 text-gray-700 font-semibold">Choose Route</label>
            <select id="routeSelect" class="border p-3 rounded w-full">
                <option value="Kabale - Rubanda - Kisoro">Kabale - Rubanda - Kisoro</option>
                <option value="Kabale - Rukiga - Rukungiri">Kabale - Rukiga - Rukungiri</option>
                <option value="Kabale - Rubanda - Kanungu">Kabale - Rubanda - Kanungu</option>
            </select>

            <button onclick="bookRoute()"
                    class="mt-4 px-4 py-3 bg-blue-900 text-white rounded hover:bg-blue-700">
                Confirm Booking
            </button>

            <div id="result" class="mt-4 text-green-700 font-semibold"></div>
        </div>

        <script>
            function bookRoute() {
                let r = document.getElementById("routeSelect").value;
                document.getElementById("result").innerHTML =
                    "Your booking for <b>" + r + "</b> has been submitted (demo mode).";
            }
        </script>

    </main>

</div>

</body>
</html>
